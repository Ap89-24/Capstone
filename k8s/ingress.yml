# https://kubernetes.io/docs/concepts/services-networking/ingress/#the-ingress-resource

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proton-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: sandbox.local
      http:
       paths:
        - path: "/api/sandbox"
          pathType: Prefix
          backend:
           service:
             name: sandbox-service
             port:
               number: 80