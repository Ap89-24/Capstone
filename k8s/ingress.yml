# https://kubernetes.io/docs/concepts/services-networking/ingress/#the-ingress-resource

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proton-ingress
  namespace: 
  labels:
    app.kubernetes.io/name: proton-ingress 
spec:
  ingressClassName: nginx
  rules:
  - http:
       paths:
        - path: "/api/sandbox"
          pathType: Prefix
          backend:
           service:
             name: sandbox-service
             port:
               number: 80