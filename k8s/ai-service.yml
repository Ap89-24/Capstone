# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    name: ai-service
  namespace: default
spec:
  selector:
    app: ai-server
  type: ClusterIP
  ports:
  - name: ai-http
    protocol: TCP
    port: 80
    targetPort: 3000
    
